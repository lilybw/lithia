[package]
name = "lithia-bench"
description = "Benchmarks from the lithia spec (§15)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository = "https://github.com/lilybw/lithia"
homepage = "https://lilybw.com/lithia/"
documentation = "https://lilybw.com/lithia/api/lithia/"

[dependencies]
lithia = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "spec"
harness = false

[[bench]]
name = "allocs"
harness = false

# Only on request, as `cargo bench -p lithia-bench --bench scaling`: it matters when the host changes.
[[bench]]
name = "scaling"
harness = false
bench = false

[lints]
workspace = true
