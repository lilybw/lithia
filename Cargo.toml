[workspace]
resolver = "3"
members = [
    "crates/lithia",
    "crates/macro",
    "crates/validation",
    "crates/test",
    "crates/bench",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MPL-2.0"
repository = "https://github.com/lilybw/lithia"
homepage = "https://lilybw.com/lithia/"
documentation = "https://lilybw.com/lithia/api/lithia/"

[workspace.dependencies]
lithia = { path = "crates/lithia", version = "0.5.0" }
lithia-macro = { path = "crates/macro", version = "0.5.0" }
lithia-test = { path = "crates/test" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
arc-swap = "1"
parking_lot = "0.13"
tracing = { version = "0.1", default-features = false, features = ["std"] }
bitflags = "2"
syn = { version = "3", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
loom = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(lithia_loom)"] }
missing_debug_implementations = "allow"
