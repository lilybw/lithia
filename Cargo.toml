[workspace]
resolver = "3"
members = [
    "crates/lithia",
    "crates/macro",
    "crates/validation",
    "crates/test",
    "crates/bench",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
publish = true
license = "MPL-2.0"
repository = "https://github.com/lilybw/lithia"
homepage = "https://lilybw.com/lithia/"
documentation = "https://lilybw.com/lithia/api/lithia/"

[workspace.dependencies]
lithia = { package = "lithate", path = "crates/lithia", version = "0.5.0" }
# Exact: the macro expands to `lithia::__private`, which only the same version of lithia provides.
lithia-macro = { path = "crates/macro", version = "=0.5.0" }
lithia-test = { path = "crates/test" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
parking_lot = "0.13"
tracing = { version = "0.1", default-features = false, features = ["std"] }
bitflags = "2"
pin-project-lite = "0.2"
smallvec = { version = "1.16", features = ["const_new", "union"] }
syn = { version = "3", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
loom = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pins the scaling benchmark's threads (`LITHIA_BENCH_PIN`).
core_affinity = "0.8"
# An allocator the benchmarks may run on (`--features mimalloc`).
mimalloc = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(lithia_loom)",
    'cfg(lithia_sweep_lock, values("parking_lot", "fair", "std", "spin", "ticket"))',
    "cfg(lithia_lock_stats)",
] }
missing_debug_implementations = "allow"
