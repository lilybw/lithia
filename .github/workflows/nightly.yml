# Every push to `nightly` runs the full test matrix. A commit it passes on, and the full extended run
# too, is a release candidate for publish.yml, which looks for this workflow's run by name.
name: nightly

on:
  push:
    branches: [nightly]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
