# Lints, tests, validation cases, compile-fail cases and loom models on Ubuntu and Windows;
# the tests and the loom models run as separate jobs, side by side.
name: ci

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [nightly, release]

permissions:
  contents: read

env:
  # The compile-fail cases' expected errors are tied to this rustc version.
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [tests, loom]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Line tables keep panics' locations and cut most of the debug info the linker must write.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      # rust-lld links the many test binaries much faster than MSVC's link.exe.
      - name: Link with rust-lld
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suite }}

      - name: Format
        if: matrix.suite == 'tests' && runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint
        if: matrix.suite == 'tests'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        if: matrix.suite == 'tests'
        run: cargo doc --no-deps -p lithia -p lithia-macro --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Docs site snapshot
        if: matrix.suite == 'tests' && runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends pandoc
          python3 .github/scripts/site.py snapshot --version 0.0.0 --out target/site-snapshot

      - name: Tests, validation and compile-fail cases
        if: matrix.suite == 'tests'
        run: cargo test --workspace --locked

      - name: Lint (loom)
        if: matrix.suite == 'loom'
        run: cargo clippy -p lithia -p lithia-test --all-targets --locked -- -D warnings
        env:
          RUSTFLAGS: --cfg lithia_loom
          CARGO_TARGET_DIR: target/loom

      - name: Loom models
        if: matrix.suite == 'loom'
        run: cargo test -p lithia-test --test loom --release --locked
        env:
          RUSTFLAGS: --cfg lithia_loom
          CARGO_TARGET_DIR: target/loom
