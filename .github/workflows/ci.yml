# Lints, tests, validation cases and compile-fail cases on Linux (x86-64 and ARM), Windows and macOS;
# the loom models on Linux and Windows, as separate jobs; the tests on the oldest supported rustc; and
# TLC on the TLA+ models that finish within minutes (the two larger ones run in extended.yml).
name: ci

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [nightly, release]
  # Branches named verify/… run CI on push, so a change can be checked before its pull request.
  push:
    branches: ["verify/**"]

permissions:
  contents: read

env:
  # The compile-fail cases' expected errors are tied to this rustc version.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        suite: [tests, loom]
        # Loom explores the memory model itself, so another architecture adds nothing to it.
        exclude:
          - os: ubuntu-24.04-arm
            suite: loom
          - os: macos-latest
            suite: loom
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Line tables keep panics' locations and cut most of the debug info the linker must write.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The toolchain and its components are rust-toolchain.toml's.
      - name: Install Rust
        run: rustup toolchain install

      # rust-lld links the many test binaries much faster than MSVC's link.exe.
      - name: Link with rust-lld
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suite }}

      - name: Format
        if: matrix.suite == 'tests' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Lint
        if: matrix.suite == 'tests'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        if: matrix.suite == 'tests'
        run: cargo doc --no-deps -p lithia -p lithia-macro --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Docs site snapshot
        if: matrix.suite == 'tests' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends pandoc
          python3 .github/scripts/site.py snapshot --version 0.0.0 --out target/site-snapshot

      - name: Tests, validation and compile-fail cases
        if: matrix.suite == 'tests'
        run: cargo test --workspace --locked

      - name: Lint (loom)
        if: matrix.suite == 'loom'
        run: cargo clippy -p lithia -p lithia-test --all-targets --locked -- -D warnings
        env:
          RUSTFLAGS: --cfg lithia_loom
          CARGO_TARGET_DIR: target/loom

      - name: Loom models
        if: matrix.suite == 'loom'
        run: cargo test -p lithia-test --test loom --release --locked
        env:
          RUSTFLAGS: --cfg lithia_loom
          CARGO_TARGET_DIR: target/loom

      # Again with every ready run in a task of its own, the path the fast path falls back to.
      - name: Loom models (no fast path)
        if: matrix.suite == 'loom'
        run: cargo test -p lithia-test --test loom --release --locked
        env:
          RUSTFLAGS: --cfg lithia_loom
          CARGO_TARGET_DIR: target/loom
          LITHIA_LOOM_FAST_PATH: off

  # The declared minimum (`rust-version`). The compile-fail cases' messages belong to rust-toolchain.toml's.
  msrv:
    name: tests (rustc 1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Tests and validation cases
        run: cargo test --workspace --locked -- --skip compile_errors

  tlc:
    name: tlc (${{ matrix.model }})
    strategy:
      fail-fast: false
      matrix:
        model:
          - MCSupersede
          - MCAsyncChain
          - MCWriteBack
          - MCBinding
          - MCAbsorb
          - MCRecover
          - MCResilience
          - MCGenerator
          - MCCreator
          - MCReflow
          - MCReflowBack
          - MCDispose
          - MCReturn
          - MCWriter
          - MCGeneration
          - MCScoped
          - MCKeyed
          - MCDisposal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: TLC
        working-directory: docs/tla/models
        run: ../tlc.sh ${{ matrix.model }}
