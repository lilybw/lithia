# Lints, tests, validation cases, compile-fail cases and loom models on Ubuntu and Windows.
name: ci

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [nightly, release]

permissions:
  contents: read

env:
  # The compile-fail cases' expected errors are tied to this rustc version.
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        run: cargo doc --no-deps -p lithia -p lithia-macro --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Tests, validation and compile-fail cases
        run: cargo test --workspace --locked

      - name: Lint (loom)
        run: cargo clippy -p lithia -p lithia-test --all-targets --locked -- -D warnings
        env:
          RUSTFLAGS: --cfg lithia_loom
          CARGO_TARGET_DIR: target/loom

      - name: Loom models
        run: cargo test -p lithia-test --test loom --release --locked
        env:
          RUSTFLAGS: --cfg lithia_loom
          CARGO_TARGET_DIR: target/loom
