# Publishes the docs site: every release's API reference and spec under versions/<version>/, the
# newest also at api/ and spec/. Run by publish.yml after a release, or by hand to rebuild.
name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v6

      - name: Assemble the site from releases
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 .github/scripts/site.py assemble --out target/site --keep 50 --base-path "$BASE_PATH/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
