# Slower checks that do not gate a release: Miri, the loom models at bound 4 with and without the
# fast path, TLC on the TLA+ model of the scheduling protocol, the kept mutations, and stress runs of
# every test binary on Linux (x86-64 and ARM) and macOS (ARM). They run on every push to `nightly`,
# weekly, and on pull requests; a nightly tag is promoted to `release` once they pass on it.
name: extended

on:
  push:
    branches: [nightly, "verify/**"]
  pull_request:
    branches: [nightly, release]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: stress

      - name: Every test binary 200 times in release, 100 in debug, 100 on one core
        run: .github/scripts/stress.sh 200 100 100 target/stress

      - name: Keep the failed runs' output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-failures-${{ matrix.os }}
          path: target/stress
          if-no-files-found: ignore

