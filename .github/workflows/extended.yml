# Diagnostic: the edge-test binary 800 times on macOS, counting failures per test.
name: extended

on:
  push:
    branches: ["verify/**"]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  stress:
    name: edge x800 (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Edge tests 800 times
        run: |
          bin="$(cargo test -p lithia-test --test edge --release --locked --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable')"
          : > failures.txt
          for i in $(seq 1 800); do
            if ! out="$("$bin" --quiet 2>&1 < /dev/null)"; then
              printf '%s\n' "$out" | grep -E "^---- " | sed -E 's/---- (.*) stdout ----/\1/' >> failures.txt
            fi
          done
          echo "failures per test over 800 runs:"
          sort failures.txt | uniq -c | sort -rn
